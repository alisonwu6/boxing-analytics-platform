openapi: 3.0.0
info:
  title: Boxing Analytics Platform API
  version: 1.0.0
  description: |
    API for the boxing analytics platform.

    Session lifecycle:
    1. User registers or logs in
    2. User creates an upload session with metadata (title, type, date)
    3. For each file (CSV / MOV), the frontend requests a presigned S3 URL, uploads directly to S3, then confirms completion to the backend
    4. User triggers analysis — the backend fires a Python ML subprocess in the background
    5. The ML script reads the uploaded files directly from S3 and runs inference (IMU model for CSV, video model for MOV)
    6. Results are written back to the database when inference completes
    7. Frontend polls session status and fetches results once `canFetchResults` is true

servers:
  - url: http://localhost:3001
    description: Development server

tags:
  - name: Auth
    description: Register, login, and get current user
  - name: Sessions
    description: |
      Session workflow APIs.
        1. Create an upload session
        2. Request a presigned URL for each file to upload
        3. Upload files directly to S3 with the presigned URLs
        4. Mark uploads as completed in the backend
        5. Start session analysis
        6. Poll session status and fetch results when processing is complete
        7. If a MOV was uploaded, request a pre-signed URL to stream the annotated video

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Failed to upload session files

    User:
      type: object
      required:
        - id
        - email
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 9e5e6d48-d6de-46af-b3d6-6d5f54d6de72
        email:
          type: string
          format: email
          example: alison.test@kivomotion.com
        name:
          type: string
          example: Alison Wu
        createdAt:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.300Z

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: alison.test@kivomotion.com
        password:
          type: string
          format: password
          example: test1234
        name:
          type: string
          example: Alison Wu

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alison.test@kivomotion.com
        password:
          type: string
          format: password
          example: test1234

    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    UploadFileStatus:
      type: string
      description: Upload state for one source file.
      enum: [missing, uploaded, failed]
      example: uploaded

    Session:
      type: object
      required:
        - id
        - userId
        - title
        - sessionDate
        - sessionStartAt
        - sessionEndAt
        - sessionType
        - csvUploadStatus
        - movUploadStatus
        - status
        - processingStatus
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: c3687532-5f0d-4da1-88da-6057ec4ca0d7
        userId:
          type: string
          example: anonymous
        title:
          type: string
          example: Morning Sparring Session
        sessionDate:
          type: string
          format: date-time
          description: Raw session date timestamp
          example: 2026-03-29T13:03:55.300Z
        sessionStartAt:
          type: string
          format: date-time
          description: Raw session start timestamp
          example: 2026-03-29T13:03:55.300Z
        sessionEndAt:
          type: string
          format: date-time
          description: Raw session end timestamp
          example: 2026-03-29T14:03:55.300Z
        sessionType:
          type: string
          enum: [training, match]
          example: training
        csvUploadStatus:
          allOf:
            - $ref: '#/components/schemas/UploadFileStatus'
          description: Current upload state for the CSV file.
        movUploadStatus:
          allOf:
            - $ref: '#/components/schemas/UploadFileStatus'
          description: Current upload state for the MOV file.
        status:
          type: string
          description: Session lifecycle state. `draft` means the session exists but no file upload has completed yet. `ready` means at least one file upload has completed and analysis can be started.
          enum: [draft, ready, processing, completed, failed]
          example: draft
        processingStatus:
          type: string
          description: Analysis job state. `idle` means analysis has not started yet.
          enum: [idle, queued, preprocessing, inferencing, completed, failed]
          example: idle
        createdAt:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.300Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.353Z

    SessionSummary:
      type: object
      required:
        - id
        - userId
        - title
        - sessionDate
        - sessionStartAt
        - sessionEndAt
        - sessionType
        - csvUploadStatus
        - movUploadStatus
        - status
        - processingStatus
      properties:
        id:
          type: string
          format: uuid
          example: c3687532-5f0d-4da1-88da-6057ec4ca0d7
        userId:
          type: string
          format: uuid
          example: 9e5e6d48-d6de-46af-b3d6-6d5f54d6de72
        title:
          type: string
          example: Boxing Session Upload
        sessionDate:
          type: string
          format: date-time
          example: 2026-03-30T01:39:10.224Z
        sessionStartAt:
          type: string
          format: date-time
          example: 2026-03-30T01:39:10.224Z
        sessionEndAt:
          type: string
          format: date-time
          example: 2026-03-30T02:09:10.224Z
        sessionType:
          type: string
          enum: [training, match]
          example: training
        csvUploadStatus:
          allOf:
            - $ref: '#/components/schemas/UploadFileStatus'
          description: Current upload state for the CSV file.
        movUploadStatus:
          allOf:
            - $ref: '#/components/schemas/UploadFileStatus'
          description: Current upload state for the MOV file.
        status:
          type: string
          enum: [draft, ready, processing, completed, failed]
          example: draft
        processingStatus:
          type: string
          description: Analysis job state for this session.
          enum: [idle, queued, preprocessing, inferencing, completed, failed]
          example: idle

    UploadSessionRequest:
      type: object
      properties:
        csvFile:
          type: string
          format: binary
        movFile:
          type: string
          format: binary
        title:
          type: string
          example: Morning Sparring Session
        sessionType:
          type: string
          enum: [training, match]
          example: training
        sessionDate:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.300Z
        sessionStartAt:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.300Z
        sessionEndAt:
          type: string
          format: date-time
          example: 2026-03-29T14:03:55.300Z

    UploadSessionResponse:
      type: object
      required:
        - message
        - session
      properties:
        message:
          type: string
          example: Files uploaded and session updated
        session:
          $ref: '#/components/schemas/SessionSummary'

    UploadSessionCreateRequest:
      type: object
      properties:
        title:
          type: string
          example: Morning Sparring Session
        sessionType:
          type: string
          enum: [training, match]
          example: training
        sessionDate:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.300Z
        sessionStartAt:
          type: string
          format: date-time
          example: 2026-03-29T13:03:55.300Z
        sessionEndAt:
          type: string
          format: date-time
          example: 2026-03-29T14:03:55.300Z

    PresignUploadRequest:
      type: object
      required:
        - fileType
      properties:
        fileType:
          type: string
          enum: [csv, mov]
          example: csv
        contentType:
          type: string
          example: text/csv
        originalFileName:
          type: string
          example: imu.csv

    PresignUploadResponse:
      type: object
      required:
        - uploadSessionId
        - fileType
        - bucket
        - key
        - uploadUrl
        - expiresIn
        - region
      properties:
        uploadSessionId:
          type: string
          format: uuid
          example: c3687532-5f0d-4da1-88da-6057ec4ca0d7
        fileType:
          type: string
          enum: [csv, mov]
          example: csv
        bucket:
          type: string
          example: boxing-analytics-uploads
        key:
          type: string
          description: S3 object key in the format `uploads/{userId}/{sessionId}/{fileName}`.
          example: uploads/user-123/session-123/imu.csv
        uploadUrl:
          type: string
          format: uri
          example: https://boxing-analytics-uploads.s3.ap-southeast-2.amazonaws.com/uploads/...
        expiresIn:
          type: integer
          example: 900
        region:
          type: string
          example: ap-southeast-2

    CompleteUploadRequest:
      type: object
      required:
        - fileType
        - key
      properties:
        fileType:
          type: string
          enum: [csv, mov]
          example: csv
        key:
          type: string
          description: The exact S3 object key returned by the presign response, using the format `uploads/{userId}/{sessionId}/{fileName}`.
          example: uploads/user-123/session-123/imu.csv

    CompleteUploadResponse:
      type: object
      required:
        - message
        - session
      properties:
        message:
          type: string
          example: Upload session updated
        session:
          $ref: '#/components/schemas/Session'

    AnalyzeSessionResponse:
      type: object
      required:
        - message
        - sessionId
        - status
        - processingStatus
      properties:
        message:
          type: string
          example: Session analysis started
        sessionId:
          type: string
          format: uuid
          example: c3687532-5f0d-4da1-88da-6057ec4ca0d7
        status:
          type: string
          enum: [draft, ready, processing, completed, failed]
          example: processing
        processingStatus:
          type: string
          enum: [idle, queued, preprocessing, inferencing, completed, failed]
          example: queued

    SessionStatusResponse:
      type: object
      required:
        - sessionId
        - status
        - processingStatus
        - canFetchResults
      properties:
        sessionId:
          type: string
          format: uuid
          example: c3687532-5f0d-4da1-88da-6057ec4ca0d7
        status:
          type: string
          enum: [draft, ready, processing, completed, failed]
          example: processing
        processingStatus:
          type: string
          enum: [idle, queued, preprocessing, inferencing, completed, failed]
          example: queued
        modelVersion:
          type: string
          nullable: true
          example: imu-punch-v1.2.0
        errorMessage:
          type: string
          nullable: true
          example: null
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
          example: 2026-03-29T13:10:00.000Z
        processingFinishedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        canFetchResults:
          type: boolean
          example: false

    Metric:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          example: totalPunches
        value:
          example: 42

    PunchEvent:
      type: object
      required:
        - t
        - hand
        - type
      properties:
        t:
          type: number
          description: Timestamp in seconds from session start
          example: 1.23
        hand:
          type: string
          enum: [left, right]
          example: right
        type:
          type: string
          description: Punch classification (e.g. jab, cross, hook, uppercut)
          example: jab

    SessionResultsPayload:
      type: object
      required:
        - sessionId
        - modelVersion
        - resultSummary
        - metrics
        - punchEvents
        - artifacts
      properties:
        sessionId:
          type: string
          format: uuid
          example: c3687532-5f0d-4da1-88da-6057ec4ca0d7
        modelVersion:
          type: string
          nullable: true
          example: imu-punch-v1.0.0
        resultSummary:
          type: array
          items: {}
          description: High-level summary items produced by the ML model
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
          description: Quantitative metrics for the session
        punchEvents:
          type: array
          items:
            $ref: '#/components/schemas/PunchEvent'
          description: Per-punch detection events with timestamps
        artifacts:
          type: object
          description: Optional extra outputs from the ML model (e.g. annotated video URLs)
          additionalProperties: true
        errorMessage:
          type: string
          nullable: true
          description: Set if inference failed
        processingStartedAt:
          type: string
          format: date-time
          nullable: true
        processingFinishedAt:
          type: string
          format: date-time
          nullable: true

    SessionVideoUrlResponse:
      type: object
      required:
        - videoUrl
        - expiresIn
      properties:
        videoUrl:
          type: string
          format: uri
          description: Pre-signed S3 URL to stream the annotated video. Valid for `expiresIn` seconds.
          example: https://boxing-analytics-upload-files.s3.ap-southeast-2.amazonaws.com/outputs/session-123/annotated_video.mp4?...
        expiresIn:
          type: integer
          description: Number of seconds until the URL expires.
          example: 3600

  responses:
    UnauthorizedError:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Authentication required
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Session not found
    InternalServerError:
      description: Unexpected server-side failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Failed to load sessions

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: alison.test@kivomotion.com
              password: test1234
              name: Alison Wu
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Failed to register user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to register user

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alison.test@kivomotion.com
              password: test1234
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: User not found or password invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    error: User not found
                invalidPassword:
                  value:
                    error: Invalid password
        '500':
          description: Login failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Login failed

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: User not found
        '500':
          description: Failed to get user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to get user

  /sessions:
    get:
      tags:
        - Sessions
      summary: List boxing sessions
      description: Returns saved sessions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '500':
          description: Failed to load sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to load sessions

  /sessions/{id}:
    get:
      tags:
        - Sessions
      summary: Get session detail
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Session identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Session not found
        '500':
          description: Failed to load session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to load session

  /upload-sessions:
    post:
      tags:
        - Sessions
      summary: Create an upload session
      description: |
        Creates an `UploadSession` record in the database with initial metadata.
        This is useful when the client wants a session ID before sending multipart file uploads.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSessionCreateRequest'
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '500':
          description: Failed to create upload session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to create upload session

  /upload-sessions/{id}/presign:
    post:
      tags:
        - Sessions
      summary: Create a presigned S3 upload URL for an upload session
      description: |
        This endpoint returns a presigned S3 upload URL for one file.
        After receiving `uploadUrl`, the client must upload the selected file directly to S3 using `HTTP PUT`.
        Once the upload succeeds, the client must call `POST /upload-sessions/{id}/complete` with the same object key.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Upload session identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignUploadRequest'
      responses:
        '200':
          description: Presigned upload URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadResponse'
        '400':
          description: Invalid presign request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Upload session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Upload session not found
        '500':
          description: Failed to create presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to create presigned upload URL

  /upload-sessions/{id}/complete:
    post:
      tags:
        - Sessions
      summary: Mark an S3 upload as completed for a session file
      description: |
        Use this after the frontend finishes uploading one file to S3.
        The backend verifies the object exists in S3 before updating upload status.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Upload session identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Upload session updated after S3 upload completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteUploadResponse'
        '400':
          description: Invalid completion payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Uploaded object was not found in S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Upload session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Upload session not found
        '500':
          description: Failed to complete upload session file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to complete upload session file

  /sessions/{id}/analyze:
    post:
      tags:
        - Sessions
      summary: Start analysis for a session
      description: |
        Call this after the user clicks Analyze Session.
        The backend immediately returns 202 and fires ML inference as a background subprocess.
        The Python script reads the uploaded CSV (and MOV if present) directly from S3 and writes results back to the database when done.
        Poll `GET /sessions/{id}/status` until `canFetchResults` is true, then call `GET /sessions/{id}/results`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Session identifier
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Session analysis started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeSessionResponse'
        '400':
          description: Session cannot be analyzed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Session has no uploaded files
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Failed to start session analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to start session analysis

  /sessions/{id}/status:
    get:
      tags:
        - Sessions
      summary: Get session processing status
      description: |
        Poll this endpoint after the user clicks Analyze Session.
        Keep polling until status becomes completed or failed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Session identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          description: Failed to load session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Failed to load session status

  /sessions/{id}/results/video:
    get:
      tags:
        - Sessions
      summary: Get a pre-signed URL to stream the annotated video
      description: |
        Returns a short-lived pre-signed S3 URL for the annotated output video produced by the video model.
        Only available if a MOV file was uploaded and analysis has completed.
        Use the URL directly in a `<video>` tag — it expires after `expiresIn` seconds.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Session identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pre-signed video URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionVideoUrlResponse'
        '404':
          description: Session not found or no annotated video available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: No annotated video available for this session
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
